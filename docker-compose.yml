services:
  wb-trainer-bot:
    build: .
    container_name: wb-trainer-bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${WEBAPP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped
